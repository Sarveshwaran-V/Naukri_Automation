<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cAnbIdate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" title="cAnbIdate">
          <img src="icons/brand-mark.png" alt="cAnbIdate" class="brand-logo-img">
        </div>
        <div class="brand-text-wrap">
          <h1 class="brand-title">c<span class="ai-spark">A</span>nb<span class="ai-spark">I</span>date</h1>
          <p class="brand-sub">TALENT INTELLIGENCE &amp; RESUME AUDIT</p>
        </div>
      </div>
      <div class="header-right">
        <span id="resumeTick" class="resume-pill hidden" title="Attached CV detected on active page">
          <span class="tick-mark">✓</span> Resume detected
        </span>
        <div id="page-status" class="status-pill status-ready">Checking...</div>
        <button type="button" id="toggleSettingsBtn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Collapsible Settings Panel -->
    <section id="settingsPanel" class="settings-panel hidden">
      <div class="settings-header">
        <span>Settings & Configuration</span>
        <button type="button" id="closeSettingsBtn" class="close-btn">&times;</button>
      </div>

      <!-- Gemini API Key Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="geminiApiKey" style="font-weight: 700; color: #0f172a;">Google Gemini API Key</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">Get free key ↗</a>
        </div>
        <input 
          type="password" 
          id="geminiApiKey" 
          class="form-control" 
          placeholder="Paste Gemini API key (AIzaSy...)" 
          value="" 
        />
        <span style="font-size: 10.5px; color: #64748b;">Stored locally in your browser. Forwarded to Gemini API.</span>
      </div>
      
      <div class="form-group" style="margin-top: 4px;">
        <div class="label-row">
          <label for="apiUrl">Backend API URL</label>
          <button type="button" id="toggleHttpBtn" class="link-btn">Use HTTPS (5001)</button>
        </div>
        <input 
          type="text" 
          id="apiUrl" 
          class="form-control" 
          placeholder="http://localhost:5000" 
          value="http://localhost:5000" 
        />
      </div>
    </section>

    <!-- Main Form -->
    <main class="form-body">
      <!-- Job Title & Max Notice -->
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="jobTitle">Target Job Title</label>
          <input 
            type="text" 
            id="jobTitle" 
            class="form-control" 
            placeholder="e.g. Senior .NET Developer" 
            value="Senior .NET Full Stack Engineer" 
          />
        </div>
        <div class="form-group flex-notice">
          <label for="maxNoticePeriod">Max Notice</label>
          <div class="input-suffix-wrap">
            <input 
              type="number" 
              id="maxNoticePeriod" 
              class="form-control" 
              min="0" 
              max="180" 
              value="30" 
            />
            <span class="input-suffix">days</span>
          </div>
        </div>
      </div>

      <!-- Skills Section: Mandatory vs Skills -->
      <div class="skills-card">
        <div class="form-group">
          <div class="label-row">
            <label for="mandatorySkills" class="label-mandatory">
              Mandatory Skills
              <span class="priority-badge-high">Must-Have · Knockout</span>
            </label>
          </div>
          <input 
            type="text" 
            id="mandatorySkills" 
            class="form-control input-mandatory" 
            placeholder="e.g. C#, .NET Core, SQL (Strict knockout criteria)" 
            value="C#, .NET Core, Microservices, SQL, Entity Framework" 
          />
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <div class="label-row">
            <label for="preferredSkills" class="label-preferred">
              Skills
              <span class="priority-badge-normal">Preferred · Bonus</span>
            </label>
          </div>
          <input 
            type="text" 
            id="preferredSkills" 
            class="form-control" 
            placeholder="e.g. Docker, Redis, Azure, CI/CD (Bonus points)" 
            value="Docker, Redis, Azure, CI/CD" 
          />
        </div>
      </div>

      <!-- Job Description -->
      <div class="form-group">
        <label for="jobDescription">Job Description / Requirements</label>
        <textarea 
          id="jobDescription" 
          class="form-control text-area-compact" 
          rows="3" 
          placeholder="Paste requirements summary..."
        >We are looking for a Senior .NET Developer with 4+ years of hands-on experience in C#, ASP.NET Core, REST APIs, and microservices architecture. Strong knowledge of PostgreSQL/SQL Server, Docker, and CI/CD pipelines is preferred. Candidates must be available to join within 30 days or less.</textarea>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons-stack">
        <button id="deepAuditBtn" class="btn btn-primary">
          <span class="btn-text">Deep Analyze Opened Profile & Resume</span>
          <span class="btn-spinner hidden"></span>
        </button>

        <button id="linkedInAuditBtn" class="btn btn-linkedin" title="Extract and audit candidate profile from LinkedIn Recruiter">
          <svg class="btn-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9h2.79v8.37H6.46v-8.37M7.86 6.55a1.63 1.63 0 0 0-1.63 1.63c0 .9.73 1.63 1.63 1.63.9 0 1.63-.73 1.63-1.63 0-.9-.73-1.63-1.63-1.63Z"/>
          </svg>
          <span class="btn-text">Analyze LinkedIn Recruiter Profile</span>
          <span class="btn-spinner hidden"></span>
        </button>

        <button id="evaluateBtn" class="btn btn-secondary">
          <span class="btn-text">Evaluate Search Page Cards</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </div>

      <!-- Status Alert Box -->
      <div id="statusAlert" class="alert hidden"></div>

      <!-- Results Summary Panel (For search page) -->
      <div id="resultsPanel" class="results-panel hidden">
        <div class="results-header">Evaluation Summary</div>
        <div class="stats-grid">
          <div class="stat-card worth-opening">
            <div class="stat-number" id="countWorth">0</div>
            <div class="stat-label">Strong Fit</div>
          </div>
          <div class="stat-card maybe">
            <div class="stat-number" id="countMaybe">0</div>
            <div class="stat-label">Review</div>
          </div>
          <div class="stat-card skip">
            <div class="stat-number" id="countSkip">0</div>
            <div class="stat-label">Pass</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Evaluates candidates using .NET 10 API and Gemini</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
